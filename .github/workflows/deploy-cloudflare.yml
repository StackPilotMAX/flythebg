name: FlyThe BG — resilient main validation
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_url:
        description: 'Optional live URL to verify after a successful deploy'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: flythebg-main-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund
      - name: Scan current source for accidental credentials
        id: secrets
        run: node scripts/check-secrets.mjs
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Build
        id: build
        run: npm run build
      - name: Verify deployment artifacts
        id: artifacts
        run: node scripts/check-build.mjs
      - name: Validate Worker bundle with Wrangler
        id: cf_bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/flythebg-wrangler && test -f /tmp/flythebg-wrangler/worker.js
      - name: SEO route smoke checks
        id: seo
        run: test -f sitemap.xml && test -f robots.txt && grep -q 'remove-bg' sitemap.xml && grep -q 'image-compressor' sitemap.xml && grep -q 'video-compressor' sitemap.xml && grep -q 'ROUTE_META' worker.js
      - name: Verify Cloudflare deploy credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy built Worker and assets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
