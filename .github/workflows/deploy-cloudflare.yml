name: FlyThe BG — resilient main validation
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_url:
        description: 'Optional live URL to verify after a successful deploy'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  # Make each push independently observable. GitHub can cancel older pending
  # runs when multiple pushes share one concurrency group.
  group: flythebg-main-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout main
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Scan current source for accidental credentials
        id: secrets
        continue-on-error: true
        run: node scripts/check-secrets.mjs
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Verify deployment artifacts
        id: artifacts
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/check-build.mjs
      - name: Validate Worker bundle with Wrangler
        id: cf_bundle
        if: ${{ steps.artifacts.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm -rf /tmp/flythebg-wrangler
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/flythebg-wrangler
          test -f /tmp/flythebg-wrangler/worker.js
          echo "Wrangler Worker bundle validation passed."
      - name: SEO route smoke checks
        id: seo
        if: ${{ steps.artifacts.outcome == 'success' }}
        continue-on-error: true
        run: |
          test -f sitemap.xml
          test -f robots.txt
          grep -q "remove-bg" sitemap.xml
          grep -q "image-compressor" sitemap.xml
          grep -q "video-compressor" sitemap.xml
          grep -q "ROUTE_META" worker.js
          echo "SEO route smoke checks passed."
      - name: Detect Cloudflare deploy credentials
        id: cf
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare GitHub deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare GitHub deployment credentials are not configured; deployment will be left to the configured Cloudflare Git integration."
          fi
      - name: Deploy built Worker and assets
        id: deploy
        if: ${{ steps.install.outcome == 'success' && steps.secrets.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.build.outcome == 'success' && steps.artifacts.outcome == 'success' && steps.seo.outcome == 'success' && steps.cf_bundle.outcome == 'success' && steps.cf.outputs.configured == 'true' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify public website (optional)
        id: verify
        if: ${{ inputs.verify_url != '' && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          VERIFY_URL: ${{ inputs.verify_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 20 "$VERIFY_URL" -o /tmp/flythebg-health.html; then
              if grep -qi 'flythebg|FlyThe BG' /tmp/flythebg-health.html; then exit 0; fi
            fi
            sleep 12
          done
          echo "::warning::Public URL verification did not confirm the FlyThe BG HTML shell."
          exit 1
      - name: Publish resilient status
        if: always()
        run: |
          {
            echo "## FlyThe BG main workflow"
            echo ""
            echo "Validation/deploy problems are surfaced as warnings instead of making the workflow red."
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Install | ${{ steps.install.outcome }} |"
            echo "| Secret scan | ${{ steps.secrets.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Artifacts | ${{ steps.artifacts.outcome }} |"
            echo "| SEO | ${{ steps.seo.outcome }} |"
            echo "| Wrangler bundle | ${{ steps.cf_bundle.outcome }} |"
            echo "| Cloudflare deploy | ${{ steps.deploy.outcome }} |"
            echo "| Live verification | ${{ steps.verify.outcome }} |"
            echo ""
            echo "A green workflow means automation completed without an unhandled CI failure; it does not claim that a skipped or failed validation deployed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in             "Install:${{ steps.install.outcome }}"             "Secret-scan:${{ steps.secrets.outcome }}"             "Typecheck:${{ steps.typecheck.outcome }}"             "Build:${{ steps.build.outcome }}"             "Artifacts:${{ steps.artifacts.outcome }}"             "SEO:${{ steps.seo.outcome }}"             "Wrangler-bundle:${{ steps.cf_bundle.outcome }}"             "Deploy:${{ steps.deploy.outcome }}"             "Live-verify:${{ steps.verify.outcome }}"; do
            status="${pair#*:}"
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]; then
              echo "::warning::$pair"
            fi
          done
          exit 0
