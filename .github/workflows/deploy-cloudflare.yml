name: Deploy Cloudflare (GitHub fallback)
on:
  workflow_dispatch:
    inputs:
      verify_url:
        description: 'Optional live URL to verify after deploy (e.g. https://flythebg.com)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify deployment artifacts
        run: node scripts/check-build.mjs
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets"; exit 1; }
      - name: Deploy built Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify public website (optional)
        if: ${{ inputs.verify_url != '' }}
        env:
          VERIFY_URL: ${{ inputs.verify_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 20 "$VERIFY_URL" -o /tmp/flythebg-health.html; then
              grep -qi 'flythebg\|FlyThe BG' /tmp/flythebg-health.html && exit 0
            fi
            sleep 12
          done
          echo "::error::Public URL did not return the FlyThe BG HTML shell"
          exit 1
